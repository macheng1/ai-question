services:
  app:
    build: .
    container_name: aiquestion-api
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-aiquestion}
      DB_USERNAME: ${DB_USERNAME:-dengke}
      DB_PASSWORD: ${DB_PASSWORD:-dengke_password}
      REDIS_HOST: host.docker.internal
      REDIS_PORT: ${REDIS_PORT:-6379}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_SSL: ${MAIL_SSL:-false}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-random-secret-at-least-32-chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace-with-another-random-secret-at-least-32-chars}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID:-}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_ENDPOINT: ${ALIYUN_SMS_ENDPOINT:-https://dysmsapi.aliyuncs.com}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      TRAINING_VIDEO_CACHE_DIRECTORY: &video_cache_directory /app/data/training-video-cache
      TRAINING_VIDEO_CACHE_MAX_BYTES: ${TRAINING_VIDEO_CACHE_MAX_BYTES:-8589934592}
      TRAINING_VIDEO_CACHE_RESERVE_BYTES: ${TRAINING_VIDEO_CACHE_RESERVE_BYTES:-2147483648}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-eds}
      TRAINING_VIDEO_BROWSER_DIRECT: ${TRAINING_VIDEO_BROWSER_DIRECT:-false}
      EDS_ENDPOINT: ${EDS_ENDPOINT:-}
      EDS_BUCKET: ${EDS_BUCKET:-}
      EDS_ACCESS_KEY_ID: ${EDS_ACCESS_KEY_ID:-}
      EDS_SECRET_KEY: ${EDS_SECRET_KEY:-}
      EDS_REGION: ${EDS_REGION:-}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-oss-cn-hangzhou.aliyuncs.com}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET:-}
      ALIYUN_OSS_REGION: ${ALIYUN_OSS_REGION:-oss-cn-hangzhou}
    volumes:
      # 同一个 Compose 项目重建后端容器时复用此卷。
      - type: volume
        source: training-video-cache
        target: *video_cache_directory
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8080}:8080"
  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        API_PROXY_ORIGIN: ${API_PROXY_ORIGIN:-http://app:8080}
    environment:
      API_PROXY_ORIGIN: ${API_PROXY_ORIGIN:-http://app:8080}
    container_name: aiquestion-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  training-video-cache:
