server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
spring:
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:true}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: aiquestion-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aiquestion}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:dengke}
    password: ${DB_PASSWORD:dengke_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.aiquestion.domain
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  reminder:
    from: ${MAIL_FROM:}
    public-url: ${APP_PUBLIC_URL:}
  trace-header: X-Trace-Id
  redis-key-prefix: ${REDIS_KEY_PREFIX:aiquestion:}
  upload:
    default-max-size-mb: ${UPLOAD_DEFAULT_MAX_SIZE_MB:10}
    absolute-max-size-mb: ${UPLOAD_ABSOLUTE_MAX_SIZE_MB:100}
    default-max-count: ${UPLOAD_DEFAULT_MAX_COUNT:1}
    absolute-max-count: ${UPLOAD_ABSOLUTE_MAX_COUNT:20}
    default-allowed-extensions: jpg,jpeg,png,gif,webp,pdf,doc,docx,xls,xlsx,txt,zip
security:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-env-at-least-32-chars}
    expires-in: ${JWT_EXPIRES_IN:7d}
    refresh-secret: ${JWT_REFRESH_SECRET:change-this-refresh-secret-in-env-at-least-32-chars}
    refresh-expires-in: ${JWT_REFRESH_EXPIRES_IN:30d}
aliyun:
  sms:
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
    endpoint: ${ALIYUN_SMS_ENDPOINT:https://dysmsapi.aliyuncs.com}
    sign-name: ${ALIYUN_SMS_SIGN_NAME:}
    template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
  oss:
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    bucket: ${ALIYUN_OSS_BUCKET:}
    region: ${ALIYUN_OSS_REGION:oss-cn-hangzhou}
